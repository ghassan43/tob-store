<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر طوب 60B - استلام كود الذكاء الاصطناعي (AI)</title>
    <!-- مكتبة الأيقونات والخطوط -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: #0d0d0d;
            background-image: url('bg.png');
            background-size: cover;
            background-position: center;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(18, 18, 18, 0.9);
            backdrop-filter: blur(10px);
            border: 2px solid #ff007f;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.3);
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            text-align: center;
        }

        .logo-icon {
            font-size: 45px;
            color: #ff007f;
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
        }

        h1 {
            font-size: 24px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 5px;
        }

        p.subtitle {
            font-size: 14px;
            color: #b3b3b3;
            margin-bottom: 25px;
        }

        /* صندوق معلومات الحساب الثابت فوق الزر */
        .account-info-box {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 20px;
            text-align: right;
            display: none;
        }

        .account-info-box p {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 8px;
            word-break: break-all;
        }

        .account-info-box p:last-child {
            margin-bottom: 0;
        }

        .account-info-box span {
            color: #00ffcc;
            font-weight: 700;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ff007f, #cc0066);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #ff198c, #e60073);
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.7);
            transform: translateY(-2px);
        }

        /* صندوق إظهار الكود والنتيجة */
        #result-box {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px dashed #00ffcc;
            border-radius: 15px;
            animation: fadeIn 0.5s ease-in-out;
        }

        .code-title {
            font-size: 14px;
            color: #b3b3b3;
            margin-bottom: 10px;
        }

        .code-display {
            font-size: 34px;
            font-weight: 900;
            color: #00ffcc;
            letter-spacing: 4px;
            margin-bottom: 10px;
            text-shadow: 0 0 12px rgba(0, 255, 204, 0.5);
        }

        .attempts-display {
            font-size: 13px;
            color: #ff4d4d;
            margin-top: 10px;
            font-weight: 600;
        }

        .error-message {
            color: #ff4d4d;
            font-size: 14px;
            margin-top: 15px;
            display: none;
            background: rgba(255, 77, 77, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 77, 77, 0.3);
        }

        .footer-note {
            margin-top: 25px;
            font-size: 11px;
            color: #666;
        }

        /* زر الواتساب العائم */
        .whatsapp-float {
            position: fixed;
            bottom: 25px;
            left: 25px;
            background-color: #25d366;
            color: #fff;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            z-index: 100;
            transition: 0.3s;
        }

        .whatsapp-float:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.6);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-icon">
            <i class="fa-solid fa-robot"></i>
        </div>
        <h1>متجر طوب 60B</h1>
        <p class="subtitle">بيانات حساب الذكاء الاصطناعي (AI)</p>

        <!-- صندوق معلومات الحساب الثابت (يظهر تلقائياً فوق الزر) -->
        <div class="account-info-box" id="accountInfoBox">
            <p><i class="fa-solid fa-envelope"></i> البريد: <span id="displayEmail">-</span></p>
            <p><i class="fa-solid fa-lock"></i> كلمة المرور: <span id="displayPassword">-</span></p>
        </div>

        <!-- زر استلام الرمز المباشر وتحت معلومات الحساب -->
        <button id="revealBtn" class="btn-submit">
            <span><i class="fa-solid fa-bolt"></i></span> استلام الرمز المؤقت الآن
        </button>

        <!-- صندوق عرض الكود بعد الضغط -->
        <div id="result-box">
            <div class="code-title">رمز التحقق المؤقت (OTP):</div>
            <div class="code-display" id="codeDisplay">------</div>
            <div class="attempts-display" id="attemptsDisplay">المحاولات المتبقية: 3</div>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="footer-note">
            <i class="fa-solid fa-shield-halved"></i> ضمان 100% وتسليم فوري آمن لقسم الـ AI
        </div>
    </div>

    <!-- زر الواتساب العائم مربوط برقمك الشخصي -->
    <a href="https://wa.me/966508400669" target="_blank" class="whatsapp-float">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('order');
        const errorBox = document.getElementById('errorMessage');
        const revealBtn = document.getElementById('revealBtn');
        const accountInfoBox = document.getElementById('accountInfoBox');

        // جلب معلومات الحساب الثابتة عند فتح الرابط
        window.addEventListener('DOMContentLoaded', async () => {
            if (!orderId) {
                errorBox.textContent = 'رقم الطلب غير موجود في الرابط.';
                errorBox.style.display = 'block';
                revealBtn.style.display = 'none';
                return;
            }

            try {
                const response = await fetch('/api/get-order-info', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ orderId })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // عرض البريد وكلمة المرور في الصندوق فوق الزر مباشرة
                    document.getElementById('displayEmail').textContent = data.account.email;
                    document.getElementById('displayPassword').textContent = data.account.password;
                    accountInfoBox.style.display = 'block';
                } else {
                    errorBox.textContent = data.message || 'رقم الطلب غير صحيح.';
                    errorBox.style.display = 'block';
                    revealBtn.style.display = 'none';
                }
            } catch (err) {
                errorBox.textContent = 'تعذر الاتصال بالسيرفر.';
                errorBox.style.display = 'block';
            }
        });

        // عند ضغط العميل على زر استلام الرمز
        revealBtn.addEventListener('click', async () => {
            errorBox.style.display = 'none';
            const resultBox = document.getElementById('result-box');

            try {
                const response = await fetch('/api/reveal-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ orderId })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    document.getElementById('codeDisplay').textContent = data.code;
                    document.getElementById('attemptsDisplay').textContent = `المحاولات المتبقية: ${data.remainingAttempts}`;
                    resultBox.style.display = 'block';
                    revealBtn.style.display = 'none'; // إخفاء الزر بعد الاستلام
                } else {
                    errorBox.textContent = data.message || 'حدث خطأ ما.';
                    errorBox.style.display = 'block';
                }
            } catch (err) {
                errorBox.textContent = 'تعذر الاتصال بالسيرفر.';
                errorBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
