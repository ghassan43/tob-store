<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر طوب 60B - استلام أكواد الذكاء الاصطناعي (AI)</title>
    <!-- مكتبة الأيقونات والخطوط -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: #0d0d0d;
            background-image: url('bg.png');
            background-size: cover;
            background-position: center;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(10px);
            border: 2px solid #ff007f;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.3);
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            text-align: center;
        }

        .logo-icon {
            font-size: 45px;
            color: #ff007f;
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
        }

        h1 {
            font-size: 24px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 5px;
        }

        p.subtitle {
            font-size: 14px;
            color: #b3b3b3;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        label {
            display: block;
            font-size: 13px;
            color: #ff007f;
            margin-bottom: 8px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #ff007f;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.2);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff007f, #cc0066);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #ff198c, #e60073);
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.7);
            transform: translateY(-2px);
        }

        /* صندوق إظهار الكود والنتيجة */
        #result-box {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px dashed #00ffcc;
            border-radius: 15px;
            animation: fadeIn 0.5s ease-in-out;
        }

        .code-title {
            font-size: 14px;
            color: #b3b3b3;
            margin-bottom: 10px;
        }

        .code-display {
            font-size: 32px;
            font-weight: 900;
            color: #00ffcc;
            letter-spacing: 4px;
            margin-bottom: 10px;
            text-shadow: 0 0 12px rgba(0, 255, 204, 0.5);
        }

        .attempts-display {
            font-size: 13px;
            color: #ff4d4d;
            margin-top: 10px;
            font-weight: 600;
        }

        .error-message {
            color: #ff4d4d;
            font-size: 13px;
            margin-top: 15px;
            display: none;
        }

        .footer-note {
            margin-top: 25px;
            font-size: 11px;
            color: #666;
        }

      /* زر الواتساب العائم */
.whatsapp-float {
    position: fixed;
    bottom: 25px;
    left: 25px;
    background-color: #25d366;
    color: #fff;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 30px;
    box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
    z-index: 100;
    transition: 0.3s;
}

.whatsapp-float:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 20px rgba(37, 211, 102, 0.6);
}

        .whatsapp-float:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.6);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-icon">
            <i class="fa-solid fa-robot"></i>
        </div>
        <h1>متجر طوب 60B</h1>
        <p class="subtitle">استلام كود اشتراك الذكاء الاصطناعي (AI) الفوري</p>

        <!-- نموذج الإدخال وزر الاستلام -->
        <form id="authForm">
            <div class="form-group" id="orderGroup">
                <label for="orderId"><i class="fa-solid fa-hashtag"></i> رقم الطلب (Reference ID)</label>
                <input type="text" id="orderId" placeholder="أدخل رقم الطلب هنا..." required>
            </div>

            <div class="form-group" id="usernameGroup">
                <label for="username"><i class="fa-solid fa-user"></i> اسم المستخدم / البريد الإلكتروني</label>
                <input type="text" id="username" placeholder="اسم المستخدم في المنصة..." required>
            </div>

            <button type="submit" class="btn-submit">
                <span><i class="fa-solid fa-bolt"></i></span> الحصول على كود الـ AI
            </button>
        </form>

        <!-- صندوق عرض الكود بعد الضغط -->
        <div id="result-box">
            <div class="code-title">رمز التحقق المؤقت الخاص بك:</div>
            <div class="code-display" id="codeDisplay">------</div>
            <div class="attempts-display" id="attemptsDisplay">المحاولات المتبقية: 3</div>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="footer-note">
            <i class="fa-solid fa-shield-halved"></i> ضمان 100% وتسليم فوري آمن لقسم الـ AI
        </div>
    </div>

    <!-- زر الواتساب العائم مربوط برقمك الشخصي -->
    <a href="https://wa.me/966508400669" target="_blank" class="whatsapp-float">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <script>
        let currentOrderId = '';

        // قراءة رقم الطلب من الرابط تلقائياً فور فتح الصفحة
        window.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const orderId = urlParams.get('order');

            if (orderId) {
                currentOrderId = orderId;

                try {
                    const response = await fetch('/api/get-order-info', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ orderId })
                    });

                    const data = await response.json();

                    if (response.ok && data.success) {
                        // إخفاء حقول الإدخال اليدوية لأن الرابط جاهز
                        document.getElementById('orderGroup').style.display = 'none';
                        document.getElementById('usernameGroup').style.display = 'none';
                        
                        // تعديل زر الاستلام ليكون جاهزاً بضغطة واحدة
                        const submitBtn = document.querySelector('.btn-submit');
                        submitBtn.innerHTML = '<span><i class="fa-solid fa-bolt"></i></span> اضغط هنا لاستلام كود الـ AI';
                    } else {
                        const errBox = document.getElementById('errorMessage');
                        errBox.textContent = data.message || 'رقم الطلب غير مسجل.';
                        errBox.style.display = 'block';
                    }
                } catch (err) {
                    console.log("خطأ في الاتصال بالسيرفر");
                }
            }
        });

        // عند ضغط العميل على زر الاستلام
        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorBox = document.getElementById('errorMessage');
            const resultBox = document.getElementById('result-box');
            const orderIdToUse = currentOrderId || document.getElementById('orderId').value.trim();

            errorBox.style.display = 'none';

            try {
                const response = await fetch('/api/reveal-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ orderId: orderIdToUse })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    document.getElementById('codeDisplay').textContent = data.code;
                    document.getElementById('attemptsDisplay').textContent = `المحاولات المتبقية: ${data.remainingAttempts}`;
                    resultBox.style.display = 'block';
                    document.getElementById('authForm').style.display = 'none'; // إخفاء النموذج بعد الاستلام لمنع التكرار
                } else {
                    errorBox.textContent = data.message || 'حدث خطأ ما.';
                    errorBox.style.display = 'block';
                }
            } catch (err) {
                errorBox.textContent = 'تعذر الاتصال بالسيرفر.';
                errorBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
